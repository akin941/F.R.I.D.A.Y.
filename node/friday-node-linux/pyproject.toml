[project]
name = "friday-node-linux"
version = "0.1.0"
description = "Friday Node for Linux (Phase 13 D10): the Python reference node packaged as a read-only daemon"
requires-python = ">=3.12,<3.13"
# Exact pins only, the same versions as backend/uv.lock (the vendored
# reference node is tested there with them). Nothing else: the daemon is
# the standard library plus these three.
dependencies = [
    "cryptography==50.0.1",
    "jsonschema==4.26.0",
    "wsproto==1.3.2",
]

[project.scripts]
friday-node-linux = "friday_node_linux.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["friday_node_linux"]

[tool.ruff]
line-length = 100
target-version = "py312"
# The vendored backend code is linted in backend/ (scripts/vendor.py keeps
# it byte-identical apart from the import rewrite and a header line).
extend-exclude = ["friday_node_linux/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

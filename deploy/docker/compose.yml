# Jarvis OS — development stack. Not production-ready by design (MVP 0);
# `compose.daily.yml` is the daily-driver override (gunicorn, prod settings,
# `next start`).
# Host ports are shifted (+1) because the other local stack commonly occupies
# 8000/5432/6379 on this machine. In-network ports are unchanged. Every port
# is published on 127.0.0.1 only (Phase 4 branch 1): nothing in this stack
# is reachable from the LAN.
#
# Secrets are never committed: DJANGO_SECRET_KEY, POSTGRES_PASSWORD and
# REDIS_PASSWORD come from the gitignored `deploy/docker/.env` (Compose reads
# it automatically; `make secrets` -- also run by `make up` -- generates any
# missing value; `deploy/docker/.env.example` lists every supported key).
name: jarvis-os

# Connector sidecars (Phase 5, ADR-010 decision 3, brief D1). Every MCP
# server Jarvis talks to runs as its own service built on this anchor, in
# the `connectors` profile (`docker compose --profile connectors up`):
# digest-pinned image, read-only root filesystem, every capability dropped,
# no new privileges, NO published ports, reachable only over the internal
# `connectors` network -- and holding only its own credential, from
# `deploy/docker/.env` (never Jarvis's env, never the database). A sidecar
# that needs the internet (e.g. GitHub) also joins `connectors-egress`. A
# stdio-only server runs behind the stdio<->HTTP bridge
# (backend/connectors/docker/stdio_bridge.py, image
# backend/connectors/docker/Dockerfile.bridge) inside its own sidecar --
# never in web or worker. Jarvis learns a sidecar's URL from the env var
# its manifest names (e.g. `GITHUB_MCP_URL: http://github-mcp:8080/mcp`).
x-connector-sidecar: &connector-sidecar
  profiles: ["connectors"]
  read_only: true
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp"]
  networks: ["connectors"]
  restart: unless-stopped

services:
  web:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.dev
    command: sh -c "uv run python manage.py migrate && uv run python manage.py seed_ai_defaults && uv run python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ../../backend:/app
    ports:
      - "127.0.0.1:8001:8000"
    environment: &backend_env
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?run `make secrets` (writes deploy/docker/.env)}"
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: "postgres://jarvis:${POSTGRES_PASSWORD:?run `make secrets`}@postgres:5432/jarvis"
      REDIS_URL: "redis://:${REDIS_PASSWORD:?run `make secrets`}@redis:6379/0"
      # Dev stack uses the deterministic fake LLM provider by default; override
      # locally (never committed) via `deploy/docker/.env` — same mechanism
      # as OBSIDIAN_VAULT_HOST_PATH below — to point this stack at a real
      # provider (e.g. NVIDIA NIM) for personal dogfooding. Untouched, this
      # still defaults to "true" so `make test-e2e`/CI stay deterministic.
      AI_FAKE_PROVIDER: "${AI_FAKE_PROVIDER:-true}"
      NVIDIA_API_KEY: "${NVIDIA_API_KEY:-}"
      NVIDIA_MODEL_ID: "${NVIDIA_MODEL_ID:-}"
      NVIDIA_BASE_URL: "${NVIDIA_BASE_URL:-}"
      NVIDIA_EMBEDDING_MODEL_ID: "${NVIDIA_EMBEDDING_MODEL_ID:-}"
      NVIDIA_EMBEDDING_DIMENSION: "${NVIDIA_EMBEDDING_DIMENSION:-1024}"
      # Ollama (MVP 12/ADR-007) — same opt-in, gitignored-.env-overridden
      # mechanism as NVIDIA_* above. OLLAMA_BASE_URL defaults to
      # host.docker.internal, the Docker Desktop DNS name for a natively-
      # running Ollama on the host machine (not containerized here).
      OLLAMA_API_KEY: "${OLLAMA_API_KEY:-}"
      OLLAMA_MODEL_ID: "${OLLAMA_MODEL_ID:-}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}"
      OLLAMA_EMBED_MODEL_ID: "${OLLAMA_EMBED_MODEL_ID:-}"
      OLLAMA_EMBED_DIMENSION: "${OLLAMA_EMBED_DIMENSION:-}"
      # Obsidian vault export (MVP 5 §3): the STRING value is shared by both
      # containers (web validates it, tier 1, with zero filesystem access at
      # request time) but only `worker` actually has anything bind-mounted
      # at this path (tier 2 -- see worker.volumes below).
      OBSIDIAN_VAULT_PATH: /vault
      # Device trust (Phase 4 branch 2): no signup, no password login. The
      # owner comes from `manage.py bootstrap_owner`, devices enroll at
      # /enroll with `manage.py issue_pairing_code`. The dev frontend runs
      # on the host (`npm run dev`) without a trusted proxy, so PINs are
      # accepted with LAN gating off (dev settings default). The shared BFF
      # key is only used by the daily stack's frontend container.
      JARVIS_BFF_SHARED_SECRET: "${JARVIS_BFF_SHARED_SECRET:-}"
      # Real values from deploy/docker/.env, empty by default (the webhook
      # then rejects everything, fail closed). A `make test-e2e` run against
      # this stack needs the e2e fixture values instead -- they live in the
      # commented "e2e run" block of deploy/docker/.env.example, never as
      # committed defaults here: a publicly known webhook secret on the
      # daily stack would let anyone who can reach it inject Telegram
      # updates.
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_WEBHOOK_SECRET: "${TELEGRAM_WEBHOOK_SECRET:-}"
    # `connectors`: the internal network the MCP sidecars listen on (web
    # runs connector reads in the chat request thread).
    networks: ["default", "connectors"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.dev
    # `-B` embeds Celery beat in this worker process (MemoryExtractionJob
    # recovery scan, MVP 2 §4; KnowledgeDocument ingestion recovery scan,
    # MVP 3 §3). Safe only with exactly ONE worker container (this dev
    # stack's topology) — running `-B` on more than one worker would
    # double-schedule the periodic tasks. If this stack ever scales to
    # multiple worker replicas, split beat into its own service first.
    # `-Q celery`: the default queue only. Harness tasks are routed to the
    # `harness` queue (CELERY_TASK_ROUTES) and run on a host runner
    # (`make harness-runner`) -- this container has no Docker access.
    command: uv run celery -A config worker -l info -B -Q celery
    volumes:
      - ../../backend:/app
      # Vault export (MVP 5 §3) is the first worker task to touch the host
      # filesystem rather than only Postgres/Redis/an outbound HTTP call --
      # deliberately mounted on `worker` only, never `web` (tier-2 existence
      # validation can only run where this is actually mounted). Override
      # the host side via OBSIDIAN_VAULT_HOST_PATH in a `deploy/docker/.env`
      # file; defaults to a repo-local, gitignored dev data directory.
      - ${OBSIDIAN_VAULT_HOST_PATH:-../../.devdata/obsidian-vault}:/vault
    environment: *backend_env
    # Connector writes, pin checks and health checks run here (Celery).
    networks: ["default", "connectors"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "uv run celery -A config inspect ping | grep -q pong"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 40s

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: jarvis
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?run `make secrets`}"
      POSTGRES_DB: jarvis
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis -d jarvis"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    # AUTH required (Phase 4 branch 1): the broker carries task payloads
    # and, since the cache moved here, throttle counters.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?run `make secrets`}"]
    environment:
      # redis-cli reads the password from here (healthcheck below), so it
      # never appears on a command line inside the container.
      REDISCLI_AUTH: "${REDIS_PASSWORD:?run `make secrets`}"
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:

networks:
  default: {}
  # No route out: sidecars and the Jarvis services that call them only.
  connectors:
    internal: true
  # For sidecars whose server must reach its vendor API; never joined by
  # web or worker.
  connectors-egress: {}

# Friday OS — development stack. Not production-ready by design (MVP 0);
# `compose.daily.yml` is the daily-driver override (gunicorn, prod settings,
# `next start`).
# Host ports are shifted (+1) to avoid clashing with other local stacks that
# commonly occupy 8000/5432/6379. In-network ports are unchanged. Every port
# is published on 127.0.0.1 only (Phase 4 branch 1): nothing in this stack
# is reachable from the LAN.
#
# Secrets are never committed: DJANGO_SECRET_KEY, POSTGRES_PASSWORD and
# REDIS_PASSWORD come from the gitignored `deploy/docker/.env` (Compose reads
# it automatically; `make secrets` -- also run by `make up` -- generates any
# missing value; `deploy/docker/.env.example` lists every supported key).
# Project renamed from `jarvis-os` on 2026-11-20 (Jarvis -> Friday). The
# Postgres data volume keeps its pre-rename name (pinned below) so an
# existing install keeps its data; see docs/runbooks/rename-jarvis-to-friday.md.
name: friday

# Connector sidecars (Phase 5, ADR-010 decision 3, brief D1). Every MCP
# server Friday talks to runs as its own service built on this anchor, in
# the `connectors` profile (`docker compose --profile connectors up`):
# digest-pinned image, read-only root filesystem, every capability dropped,
# no new privileges, NO published ports, reachable only over the internal
# `connectors` network -- and holding only its own credential, from
# `deploy/docker/.env` (never Friday's env, never the database). A sidecar
# that needs the internet (e.g. GitHub) also joins `connectors-egress`. A
# stdio-only server runs behind the stdio<->HTTP bridge
# (backend/connectors/docker/stdio_bridge.py, image
# backend/connectors/docker/Dockerfile.bridge) inside its own sidecar --
# never in web or worker. Friday learns a sidecar's URL from the env var
# its manifest names (e.g. `GITHUB_MCP_URL: http://github-mcp:8080/mcp`).
x-connector-sidecar: &connector-sidecar
  profiles: ["connectors"]
  read_only: true
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp"]
  networks: ["connectors"]
  restart: unless-stopped

services:
  web:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.dev
    command: sh -c "uv run python manage.py migrate && uv run python manage.py seed_ai_defaults && uv run python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ../../backend:/app
    ports:
      - "127.0.0.1:8001:8000"
    environment: &backend_env
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?run `make secrets` (writes deploy/docker/.env)}"
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      # Database user/name stay `jarvis`: an existing data volume was
      # initialized with them (POSTGRES_USER/DB only apply to an empty volume).
      DATABASE_URL: "postgres://jarvis:${POSTGRES_PASSWORD:?run `make secrets`}@postgres:5432/jarvis"
      REDIS_URL: "redis://:${REDIS_PASSWORD:?run `make secrets`}@redis:6379/0"
      # Dev stack uses the deterministic fake LLM provider by default; override
      # locally (never committed) via `deploy/docker/.env` — same mechanism
      # as OBSIDIAN_VAULT_HOST_PATH below — to point this stack at a real
      # provider (e.g. NVIDIA NIM) for personal dogfooding. Untouched, this
      # still defaults to "true" so `make test-e2e`/CI stay deterministic.
      AI_FAKE_PROVIDER: "${AI_FAKE_PROVIDER:-true}"
      # `make preflight` (Phase 5 closeout) runs inside `web`: its liveness
      # URL is in-container; the BFF (host `make frontend-dev`) is opt-in.
      PREFLIGHT_WEB_URL: "${PREFLIGHT_WEB_URL:-http://localhost:8000/healthz}"
      PREFLIGHT_BFF_URL: "${PREFLIGHT_BFF_URL:-}"
      # Phase 9 closeout: `node_gateway` / `node_signing_key` read the
      # gateway's /healthz over the compose network; the TLS pin check is
      # opt-in (both empty = a warning).
      PREFLIGHT_NODE_GATEWAY_URL: "${PREFLIGHT_NODE_GATEWAY_URL:-http://node-gateway:8002/healthz}"
      NODE_TLS_PIN_SHA256: "${NODE_TLS_PIN_SHA256:-}"
      PREFLIGHT_NODE_TLS_URL: "${PREFLIGHT_NODE_TLS_URL:-}"
      # OpenRouter (Phase 5 closeout): the seeded `openrouter` row stays
      # disabled while this is empty.
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OPENROUTER_MODEL_ID: "${OPENROUTER_MODEL_ID:-}"
      NVIDIA_API_KEY: "${NVIDIA_API_KEY:-}"
      NVIDIA_MODEL_ID: "${NVIDIA_MODEL_ID:-}"
      NVIDIA_BASE_URL: "${NVIDIA_BASE_URL:-}"
      NVIDIA_EMBEDDING_MODEL_ID: "${NVIDIA_EMBEDDING_MODEL_ID:-}"
      NVIDIA_EMBEDDING_DIMENSION: "${NVIDIA_EMBEDDING_DIMENSION:-1024}"
      # Ollama (MVP 12/ADR-007) — same opt-in, gitignored-.env-overridden
      # mechanism as NVIDIA_* above. OLLAMA_BASE_URL defaults to
      # host.docker.internal, the Docker Desktop DNS name for a natively-
      # running Ollama on the host machine (not containerized here).
      OLLAMA_API_KEY: "${OLLAMA_API_KEY:-}"
      OLLAMA_MODEL_ID: "${OLLAMA_MODEL_ID:-}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}"
      OLLAMA_EMBED_MODEL_ID: "${OLLAMA_EMBED_MODEL_ID:-}"
      OLLAMA_EMBED_DIMENSION: "${OLLAMA_EMBED_DIMENSION:-}"
      # Voice (Phase 6, ADR-011): the local speech server (speaches) runs
      # natively on the host like Ollama; VOICE_API_KEY is a placeholder
      # opt-in. OpenRouter audio rows stay disabled until the owner's d2
      # toggle; the key only matters after it. See docs/runbooks/voice-setup.md.
      VOICE_API_KEY: "${VOICE_API_KEY:-}"
      VOICE_BASE_URL: "${VOICE_BASE_URL:-http://host.docker.internal:8000/v1}"
      VOICE_STT_MODEL_ID: "${VOICE_STT_MODEL_ID:-}"
      VOICE_TTS_MODEL_ID: "${VOICE_TTS_MODEL_ID:-}"
      VOICE_TTS_EN_MODEL_ID: "${VOICE_TTS_EN_MODEL_ID:-}"
      VOICE_STT_LANGUAGE: "${VOICE_STT_LANGUAGE:-tr}"
      VOICE_TTS_VOICE: "${VOICE_TTS_VOICE:-tr_TR-dfki-medium}"
      AI_BUDGET_AUDIO_MONTHLY_USD: "${AI_BUDGET_AUDIO_MONTHLY_USD:-20}"
      AI_BUDGET_AUDIO_SESSION_USD: "${AI_BUDGET_AUDIO_SESSION_USD:-1}"
      # Obsidian vault export (MVP 5 §3): the STRING value is shared by both
      # containers (web validates it, tier 1, with zero filesystem access at
      # request time) but only `worker` actually has anything bind-mounted
      # at this path (tier 2 -- see worker.volumes below).
      OBSIDIAN_VAULT_PATH: /vault
      # Device trust (Phase 4 branch 2): no signup, no password login. The
      # owner comes from `manage.py bootstrap_owner`, devices enroll at
      # /enroll with `manage.py issue_pairing_code`. The dev frontend runs
      # on the host (`npm run dev`) without a trusted proxy, so PINs are
      # accepted with LAN gating off (dev settings default). The shared BFF
      # key is only used by the daily stack's frontend container.
      FRIDAY_BFF_SHARED_SECRET: "${FRIDAY_BFF_SHARED_SECRET:-}"
      # Real values from deploy/docker/.env, empty by default (the webhook
      # then rejects everything, fail closed). A `make test-e2e` run against
      # this stack needs the e2e fixture values instead -- they live in the
      # commented "e2e run" block of deploy/docker/.env.example, never as
      # committed defaults here: a publicly known webhook secret on the
      # daily stack would let anyone who can reach it inject Telegram
      # updates.
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_WEBHOOK_SECRET: "${TELEGRAM_WEBHOOK_SECRET:-}"
      # Connector sidecar URLs (Phase 5, ADR-010): only the URL -- each
      # credential lives in its sidecar's own environment, never here.
      GITHUB_MCP_URL: "${GITHUB_MCP_URL:-}"
      # n8n (Phase 12 D9): the `n8n-relay` sidecar's internal URL only; the
      # trigger's bearer lives in that sidecar alone (RELAY_BEARER_TOKEN).
      N8N_MCP_URL: "${N8N_MCP_URL:-}"
      # The relay's tool ceiling (names only, the same value and default as
      # the sidecar's BRIDGE_ALLOWED_TOOLS below), read by preflight only.
      N8N_RELAY_ALLOWED_TOOLS: "${N8N_RELAY_ALLOWED_TOOLS:-wf_Ab12Cd34Ef56Gh78,wf_Hb34Kd56Mf78Np90}"
      # Google mail/calendar bridge (Phase 5 branch 8, brief D9): the
      # Desktop-app OAuth client and the owner's refresh token printed once
      # by the host-side `manage.py connect_google`. Env only -- never the
      # database. Empty = the `google` connector reports `not_configured`.
      GOOGLE_OAUTH_CLIENT_ID: "${GOOGLE_OAUTH_CLIENT_ID:-}"
      GOOGLE_OAUTH_CLIENT_SECRET: "${GOOGLE_OAUTH_CLIENT_SECRET:-}"
      GOOGLE_OAUTH_REFRESH_TOKEN: "${GOOGLE_OAUTH_REFRESH_TOKEN:-}"
      # Friday Node (Phase 9 branch 4, docs/runbooks/friday-node.md): the
      # server's Ed25519 signing key (`make secrets` writes it into
      # deploy/docker/.env) and the retired public keys that still verify.
      # Shared by web, worker and node-gateway: `invoke_read` signs in
      # whichever process runs it (a chat turn in web, a task in worker);
      # the gateway refuses to serve without a usable key and reports its id
      # on /healthz. Empty = node pairing and invokes refuse (fail closed).
      NODE_SIGNING_KEY: "${NODE_SIGNING_KEY:-}"
      NODE_SIGNING_KEYS_RETIRED: "${NODE_SIGNING_KEYS_RETIRED:-}"
      # Pre-send compression (Phase 8B D11, docs/mcp/headroom.md): off by
      # default; the `compressor` sidecar runs only in the `compression`
      # profile. A purpose is enabled only after a recorded eval pass.
      AI_COMPRESSION_ENABLED: "${AI_COMPRESSION_ENABLED:-false}"
      AI_COMPRESSION_PURPOSES: "${AI_COMPRESSION_PURPOSES:-}"
      AI_COMPRESSION_URL: "${AI_COMPRESSION_URL:-http://compressor:8080/compress}"
      AI_COMPRESSION_TIMEOUT_MS: "${AI_COMPRESSION_TIMEOUT_MS:-300}"
    # `connectors`: the internal network the MCP sidecars listen on (web
    # runs connector reads in the chat request thread). `compression`: the
    # internal network of the `compressor` sidecar (gateway stage, D11).
    networks: ["default", "connectors", "compression"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.dev
    # `-B` embeds Celery beat in this worker process (MemoryExtractionJob
    # recovery scan, MVP 2 §4; KnowledgeDocument ingestion recovery scan,
    # MVP 3 §3). Safe only with exactly ONE worker container (this dev
    # stack's topology) — running `-B` on more than one worker would
    # double-schedule the periodic tasks. If this stack ever scales to
    # multiple worker replicas, split beat into its own service first.
    # `-Q celery`: the default queue only. Harness tasks are routed to the
    # `harness` queue (CELERY_TASK_ROUTES) and run on a host runner
    # (`make harness-runner`) -- this container has no Docker access.
    command: uv run celery -A config worker -l info -B -Q celery
    volumes:
      - ../../backend:/app
      # Vault export (MVP 5 §3) is the first worker task to touch the host
      # filesystem rather than only Postgres/Redis/an outbound HTTP call --
      # deliberately mounted on `worker` only, never `web` (tier-2 existence
      # validation can only run where this is actually mounted). Override
      # the host side via OBSIDIAN_VAULT_HOST_PATH in a `deploy/docker/.env`
      # file; defaults to a repo-local, gitignored dev data directory.
      - ${OBSIDIAN_VAULT_HOST_PATH:-../../.devdata/obsidian-vault}:/vault
    environment: *backend_env
    # Connector writes, pin checks and health checks run here (Celery);
    # background gateway calls may use the compression stage too.
    networks: ["default", "connectors", "compression"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "uv run celery -A config inspect ping | grep -q pong"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 40s

  # Friday Node gateway (Phase 9 branch 4, brief D3): the WebSocket server
  # a paired Mac node connects to (`/ws/node/v1`), in its own process --
  # `uvicorn --ws wsproto` serving config.asgi_nodes (web stays WSGI). One
  # process holds every live node socket, the per-node inbox loops and the
  # revocation subscriber; do not scale it beyond one replica. Published on
  # loopback only: expose `/ws/node/v1` through the overlay or the TLS
  # reverse proxy (docs/runbooks/friday-node.md), never on 0.0.0.0.
  node-gateway:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.dev
    command: >-
      uv run uvicorn config.asgi_nodes:application --host 0.0.0.0 --port 8002
      --ws wsproto --ws-max-size 262144 --lifespan on --no-server-header
    volumes:
      - ../../backend:/app
    ports:
      - "127.0.0.1:8002:8002"
    environment: *backend_env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # web runs the migrations the gateway's tables need.
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # GitHub connector (Phase 5 branch 5, brief D7, docs/mcp/github.md): the
  # official github-mcp-server v1.12.2 (digest-pinned in the Dockerfile)
  # in STDIO mode behind the stdio<->HTTP bridge, so the PAT stays in this
  # container: its HTTP mode would take the token from each request's
  # Authorization header, i.e. Friday would hold it. `--tools=` registers
  # only the four pinned tools; BRIDGE_ALLOWED_TOOLS repeats the ceiling.
  # Needs the internet (api.github.com) -> also joins `connectors-egress`.
  github-mcp:
    <<: *connector-sidecar
    build:
      context: ../..
      dockerfile: backend/connectors/docker/Dockerfile.github
    environment:
      BRIDGE_COMMAND: '["/server/github-mcp-server", "stdio", "--tools=pull_request_read,actions_list,get_commit,create_pull_request"]'
      BRIDGE_ALLOWED_TOOLS: "pull_request_read,actions_list,get_commit,create_pull_request"
      BRIDGE_ENV_PASSTHROUGH: "GITHUB_PERSONAL_ACCESS_TOKEN"
      # Env-only, from deploy/docker/.env; this service only.
      GITHUB_PERSONAL_ACCESS_TOKEN: "${GITHUB_PERSONAL_ACCESS_TOKEN:-}"
    networks: ["connectors", "connectors-egress"]

  # n8n relay (Phase 12 D9, docs/mcp/n8n.md, deploy/n8n/README.md): the
  # bridge image in HTTP relay mode. Friday (N8N_MCP_URL=http://n8n-relay:8080/mcp)
  # speaks Streamable HTTP to it on the internal `connectors` network; it
  # forwards only tools/list and tools/call for BRIDGE_ALLOWED_TOOLS (print
  # the line with `manage.py n8n_relay_env`) to the owner's n8n MCP Server
  # Trigger, adding the trigger's bearer -- which lives only here. No
  # redirects, no client capabilities, no published port.
  n8n-relay:
    <<: *connector-sidecar
    build:
      context: ../..
      dockerfile: backend/connectors/docker/Dockerfile.bridge
    entrypoint: ["python", "-m", "connectors.docker.http_relay"]
    environment:
      RELAY_UPSTREAM_URL: "${RELAY_UPSTREAM_URL:-}"
      # Env-only, from deploy/docker/.env; this service only.
      RELAY_BEARER_TOKEN: "${RELAY_BEARER_TOKEN:-}"
      BRIDGE_ALLOWED_TOOLS: "${N8N_RELAY_ALLOWED_TOOLS:-wf_Ab12Cd34Ef56Gh78,wf_Hb34Kd56Mf78Np90}"
    networks: ["connectors", "connectors-egress"]

  # Headroom compressor (Phase 8B branch 6, brief D11, docs/mcp/headroom.md):
  # a stdlib HTTP server exposing only `POST /compress` (and the env-only
  # `GET /healthz` preflight reads, Phase 8B closeout), image
  # deploy/compressor/Dockerfile (hash-locked wheels, no `litellm`). Opt-in
  # profile (`docker compose --profile compression up -d compressor`). Only
  # on the internal `compression` network shared with web and worker: no
  # egress, no published port, no provider key, no env file, read-only root,
  # every capability dropped; telemetry off and offline via the image env.
  compressor:
    profiles: ["compression"]
    build:
      context: ../compressor
      dockerfile: Dockerfile
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp"]
    networks: ["compression"]
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      # Legacy names kept on purpose (pre-rename volumes were initialized
      # with them; changing them would lock an existing install out).
      POSTGRES_USER: jarvis
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?run `make secrets`}"
      POSTGRES_DB: jarvis
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis -d jarvis"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    # AUTH required (Phase 4 branch 1): the broker carries task payloads
    # and, since the cache moved here, throttle counters.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?run `make secrets`}"]
    environment:
      # redis-cli reads the password from here (healthcheck below), so it
      # never appears on a command line inside the container.
      REDISCLI_AUTH: "${REDIS_PASSWORD:?run `make secrets`}"
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
    # Pinned to the pre-rename name (project `jarvis-os`) so the owner's
    # existing database survives the Jarvis -> Friday rename (2026-11-20).
    # Fresh installs get this legacy name too, on purpose: one fixed name
    # for every install, so no upgrade path ever has to move the volume.
    name: jarvis-os_postgres-data

networks:
  default: {}
  # No route out: sidecars and the Friday services that call them only.
  connectors:
    internal: true
  # For sidecars whose server must reach its vendor API; never joined by
  # web or worker.
  connectors-egress: {}
  # The compressor sidecar and its two clients only; no route out (D11).
  compression:
    internal: true

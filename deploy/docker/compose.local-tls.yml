# Loopback-only TLS for a Friday Node on THIS Mac (owner decision 2026-11-26:
# nothing is exposed beyond the machine). Overlay on compose.yml:
#
#   make local-tls            # once: a self-signed P-256 certificate, prints its pin
#   make up-local-tls         # the dev stack plus this proxy
#
# One Caddy listener on 127.0.0.1:8443 only, with the certificate from
# deploy/docker/local-tls/ (gitignored, generated by gen-local-tls.sh). It
# forwards exactly three paths -- node pairing, node credential rotation and
# the node gateway's /ws/node/v1 -- and answers 404 to everything else. The
# certificate is never added to the system trust store: the node pairs with
# the pin the owner types into its pairing window (Phase 9 M1 follow-up 2).
services:
  local-tls:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    depends_on:
      - web
      - node-gateway
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
      - ./local-tls:/certs:ro
    read_only: true
    tmpfs:
      - /data
      - /config
    cap_drop:
      - ALL
    # The image's caddy binary carries the cap_net_bind_service file
    # capability; exec fails unless the bounding set still has it.
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
  web:
    environment:
      # preflight's node_tls_pin compares the served key with the pin
      # (gen-local-tls.sh prints the value to put in deploy/docker/.env).
      PREFLIGHT_NODE_TLS_URL: "${PREFLIGHT_NODE_TLS_URL:-https://local-tls:8443/ws/node/v1}"

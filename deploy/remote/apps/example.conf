# /etc/jarvis-deploy/apps/<app>.conf -- per-app config for jarvis-deploy.sh
# (Phase 5 branch 6, brief D10/Q12). Owned by root, mode 0644, in a
# root-owned directory that is not group/world-writable; the script refuses
# anything else. Sourced by bash as the deploy user: these commands are the
# owner's, never Jarvis's -- Jarvis can only name the app and a SHA.
#
# The file name (without .conf) is the target's `remote_app` in Jarvis and
# must match [a-z0-9][a-z0-9-]{0,62}.

# A git checkout owned by the deploy user; `origin` must point at the same
# repository as the Jarvis target's repo_git_url (the runner compares them).
APP_DIR=/srv/adia-web

# Only commits reachable from origin/<TRACKED_BRANCH> are deployable.
# Must equal the target's tracked_branch in Jarvis.
TRACKED_BRANCH=main

# Run inside APP_DIR with bash -c. BUILD_CMD must not touch the running
# service (a failed build restores the previous checkout and exits 66);
# RESTART_CMD switches the live service to the checked-out code.
BUILD_CMD="docker compose build --pull"
RESTART_CMD="docker compose up -d --remove-orphans"

# Exit 0 = healthy. Local to the VPS; Jarvis may additionally GET the
# target's public health_url.
HEALTH_CMD="curl -fsS --max-time 5 http://127.0.0.1:8080/healthz"

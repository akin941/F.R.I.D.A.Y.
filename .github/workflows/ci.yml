name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: friday
          POSTGRES_PASSWORD: friday
          POSTGRES_DB: friday
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U friday -d friday"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://friday:friday@localhost:5432/friday
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Import contracts (modular monolith rules)
        run: uv run lint-imports

      - name: Missing migrations check
        run: uv run python manage.py makemigrations --check --dry-run

      # Production settings must import from a complete environment and
      # pass Django's deployment checklist (Phase 4 branch 1). Dummy values
      # only -- the secret key is generated per run, never committed.
      - name: Deploy checks (prod settings, dummy env)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_ALLOWED_HOSTS: friday.example
          REDIS_URL: redis://localhost:6379/0
        run: |
          DJANGO_SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_urlsafe(50))')" \
            uv run python manage.py check --deploy --fail-level WARNING

      - name: Tests
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      BACKEND_API_URL: http://127.0.0.1:8001/api/v1
      APP_ORIGIN: http://localhost:3001
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # Phase 6 A8: three.js / R3F reachable from /hud only, lazily.
      - name: HUD bundle split
        run: npm run check:hud-bundle

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: friday
          POSTGRES_PASSWORD: friday
          POSTGRES_DB: friday
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U friday -d friday"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://friday:friday@localhost:5432/friday
      AI_FAKE_PROVIDER: "true"
      # No Redis service in this job (MVP 2 §4/§6): eager mode runs the
      # memory-extraction task inline instead of publishing to a broker that
      # doesn't exist here.
      CELERY_TASK_ALWAYS_EAGER: "true"
      CELERY_TASK_EAGER_PROPAGATES: "true"
      BACKEND_API_URL: http://127.0.0.1:8001/api/v1
      APP_ORIGIN: http://localhost:3001
      # Device trust (Phase 4 branch 2): no signup. The owner account comes
      # from `bootstrap_owner` (step below; this password only satisfies the
      # validators -- no API endpoint accepts a password), and
      # frontend/e2e/global-setup.ts enrolls the browser with a PIN from
      # `issue_pairing_code --plain`, run through E2E_MANAGE_CMD. Dev
      # settings accept that PIN without a trusted client IP.
      FRIDAY_OWNER_PASSWORD: "e2e-Owner-Fixture-2026!"
      E2E_MANAGE_CMD: "uv run --directory ../backend python manage.py"
      # DEV/TEST ONLY fixture values (MVP 9 §4) -- same reasoning as
      # compose.yml's identical block: not real Telegram credentials, just
      # non-empty strings the e2e Telegram section (smoke.e2e.ts) needs to
      # get past TelegramWebhookView's fail-closed auth check. Must match
      # smoke.e2e.ts's TELEGRAM_WEBHOOK_SECRET default exactly.
      TELEGRAM_BOT_TOKEN: "e2e-fixture-bot-token"
      TELEGRAM_WEBHOOK_SECRET: "e2e-fixture-webhook-secret"
      # A fixed path this job's own env shares between the backend process
      # (started below) and the frontend/Playwright process (started later
      # in this same job) -- global-setup.ts creates the directory before
      # any test runs, since the backend process starts before that and
      # can't create it itself at boot (tier-2 vault-root validation only
      # runs at request time, not at startup).
      OBSIDIAN_VAULT_PATH: /tmp/friday-e2e-vault
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Migrate + seed AI defaults (FakeAdapter) + owner account
        working-directory: backend
        run: |
          uv run python manage.py migrate
          uv run python manage.py seed_ai_defaults
          uv run python manage.py bootstrap_owner --email e2e@example.test --if-absent

      - name: Start backend (background)
        working-directory: backend
        run: |
          uv run python manage.py runserver 0.0.0.0:8001 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8001/healthz && exit 0
            sleep 1
          done
          echo "backend did not become healthy in time" >&2
          exit 1

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run e2e smoke tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

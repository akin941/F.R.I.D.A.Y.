name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: friday
          POSTGRES_PASSWORD: friday
          POSTGRES_DB: friday
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U friday -d friday"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://friday:friday@localhost:5432/friday
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Import contracts (modular monolith rules)
        run: uv run lint-imports

      - name: Missing migrations check
        run: uv run python manage.py makemigrations --check --dry-run

      # Phase 8A D8: the `self` block's source snapshot must match CLAUDE.md,
      # the accepted ADRs and the MASTER_PLAN phases table.
      - name: Self sources snapshot check
        run: uv run python manage.py build_self_sources --check

      # Phase 10 branch 2: the node conformance cases (v1, v2), the sandbox
      # and streaming-scrub vectors and the vendored node scrubber must match
      # their definitions (the Swift node loads these files), and the escape
      # suite must hold against the fake sandbox.
      - name: Node conformance files check
        run: uv run python manage.py build_node_conformance --check
      - name: Node escape suite (fake sandbox)
        run: uv run python manage.py node_escape_suite --executor fake

      # Production settings must import from a complete environment and
      # pass Django's deployment checklist (Phase 4 branch 1). Dummy values
      # only -- the secret key is generated per run, never committed.
      - name: Deploy checks (prod settings, dummy env)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_ALLOWED_HOSTS: friday.example
          REDIS_URL: redis://localhost:6379/0
        run: |
          DJANGO_SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_urlsafe(50))')" \
            uv run python manage.py check --deploy --fail-level WARNING

      - name: Tests
        run: uv run pytest

      # Phase 8B branch 6 (brief D11): the compressor sidecar's server
      # refusals, stdlib only (a fake compress function; Headroom itself is
      # tested in the image build by test_no_litellm.py).
      - name: Compressor sidecar server tests (no Headroom)
        working-directory: deploy/compressor
        run: python3 test_server.py

      # Phase 8B branch 3 (brief D9): the public eval seed's retrieval
      # metrics on FakeAdapter, against the eval settings' own database
      # (`memory_eval` refuses the live settings). No answer call, no cost.
      - name: Memory eval public set (retrieval metrics, FakeAdapter)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.eval
          MEMORY_EVAL_DATABASE_NAME: friday_eval
          AI_FAKE_PROVIDER: "true"
          MEMORY_EVAL_RESULTS_DIR: ${{ runner.temp }}/friday-eval-results
        run: |
          uv run python -c "import psycopg; psycopg.connect('postgres://friday:friday@localhost:5432/friday', autocommit=True).execute('CREATE DATABASE friday_eval')"
          uv run python manage.py migrate --noinput -v 0
          uv run python manage.py seed_ai_defaults
          uv run python manage.py memory_eval baseline --set public --retrieval-only

  # Phase 11 branch 2 (brief D6, D7, D16): the node voice child. Its own
  # pyproject/uv.lock; imports nothing from backend/. No real model, mic,
  # server or network beyond localhost in any step.
  friday-voice:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node/friday-voice
    # Phase 11 closeout: the live-voice e2e (last step) runs the backend's
    # test against a live dev server, so this job has the backend's
    # Postgres; Redis for the node bus (presence) the HUD reads.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: friday
          POSTGRES_PASSWORD: friday
          POSTGRES_DB: friday
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U friday -d friday"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: node/friday-voice/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      # The case and vector files the Swift host's test target loads must
      # match their definitions; the vendored scrubber must match the backend's.
      - name: friday-voice/v1 conformance files check
        run: uv run friday-voice conformance --check
      - name: Vendored scrubber check
        run: uv run python scripts/vendor_scrubber.py --check
      - name: Pipecat surface snapshot check
        run: uv run python scripts/snapshot_pipecat.py --check

      - name: friday-voice/v1 conformance (reference implementations)
        run: uv run friday-voice conformance

      - name: Replay fixtures check
        run: uv run python scripts/make_fixtures.py --check

      - name: Replay (fixture set, manual clock, overhead baseline, barge-in + echo scripts)
        run: uv run friday-voice replay --check

      # Phase 11 D13 release gate (ADR-015 decision 4): Friday's own "Hey
      # Friday, terminali aç" through the reference host's echo double at
      # residual 0.0 / 0.3 / 1.0 never becomes a turn, a draft or a reply;
      # the negative control (filter off) must post it. Required: a failure
      # here fails the job.
      - name: Self-trigger release gate (fakes, three AEC residuals + negative control)
        run: uv run friday-voice selftest --ci

      - name: Tests
        run: uv run pytest

      # Phase 11 closeout (brief §8): the reference host + `friday-voice run`
      # + a live dev server (uvicorn, FakeAdapter, the fake speech provider),
      # all over real HTTP on the loopback: push-to-talk, a node action as a
      # card only, barge-in, the self-trigger clip at residual 1.0, the kill
      # switch and a storm. FRIDAY_VOICE_E2E=1 makes a missing child
      # environment a failure instead of a skip.
      - name: Live voice e2e (reference host + friday-voice run + live server)
        working-directory: backend
        env:
          DATABASE_URL: postgres://friday:friday@localhost:5432/friday
          REDIS_URL: redis://localhost:6379/0
          FRIDAY_VOICE_E2E: "1"
        run: |
          uv sync --frozen
          uv run pytest ops/tests/test_live_voice_e2e.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      BACKEND_API_URL: http://127.0.0.1:8001/api/v1
      APP_ORIGIN: http://localhost:3001
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # Phase 6 A8: three.js / R3F reachable from /hud only, lazily.
      - name: HUD bundle split
        run: npm run check:hud-bundle

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: friday
          POSTGRES_PASSWORD: friday
          POSTGRES_DB: friday
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U friday -d friday"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://friday:friday@localhost:5432/friday
      AI_FAKE_PROVIDER: "true"
      # No Redis service in this job (MVP 2 §4/§6): eager mode runs the
      # memory-extraction task inline instead of publishing to a broker that
      # doesn't exist here.
      CELERY_TASK_ALWAYS_EAGER: "true"
      CELERY_TASK_EAGER_PROPAGATES: "true"
      BACKEND_API_URL: http://127.0.0.1:8001/api/v1
      APP_ORIGIN: http://localhost:3001
      # Device trust (Phase 4 branch 2): no signup. The owner account comes
      # from `bootstrap_owner` (step below; this password only satisfies the
      # validators -- no API endpoint accepts a password), and
      # frontend/e2e/global-setup.ts enrolls the browser with a PIN from
      # `issue_pairing_code --plain`, run through E2E_MANAGE_CMD. Dev
      # settings accept that PIN without a trusted client IP.
      FRIDAY_OWNER_PASSWORD: "e2e-Owner-Fixture-2026!"
      E2E_MANAGE_CMD: "uv run --directory ../backend python manage.py"
      # DEV/TEST ONLY fixture values (MVP 9 §4) -- same reasoning as
      # compose.yml's identical block: not real Telegram credentials, just
      # non-empty strings the e2e Telegram section (smoke.e2e.ts) needs to
      # get past TelegramWebhookView's fail-closed auth check. Must match
      # smoke.e2e.ts's TELEGRAM_WEBHOOK_SECRET default exactly.
      TELEGRAM_BOT_TOKEN: "e2e-fixture-bot-token"
      TELEGRAM_WEBHOOK_SECRET: "e2e-fixture-webhook-secret"
      # A fixed path this job's own env shares between the backend process
      # (started below) and the frontend/Playwright process (started later
      # in this same job) -- global-setup.ts creates the directory before
      # any test runs, since the backend process starts before that and
      # can't create it itself at boot (tier-2 vault-root validation only
      # runs at request time, not at startup).
      OBSIDIAN_VAULT_PATH: /tmp/friday-e2e-vault
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Migrate + seed AI defaults (FakeAdapter) + owner account
        working-directory: backend
        run: |
          uv run python manage.py migrate
          uv run python manage.py seed_ai_defaults
          uv run python manage.py bootstrap_owner --email e2e@example.test --if-absent

      - name: Start backend (background)
        working-directory: backend
        run: |
          uv run python manage.py runserver 0.0.0.0:8001 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8001/healthz && exit 0
            sleep 1
          done
          echo "backend did not become healthy in time" >&2
          exit 1

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run e2e smoke tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
